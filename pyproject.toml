[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling-lccp"
version = "0.1.0"
description = "Evaluation and scaling-law tools for long-context continual pretraining"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
eval = ["torch", "transformers", "safetensors", "accelerate", "sentencepiece"]
bench = ["opencompass", "datasets", "mmengine"]

[tool.setuptools.packages.find]
include = ["lccp*"]
